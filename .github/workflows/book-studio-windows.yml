# Book Studio의 Windows 설치 파일을 만든다. Actions 탭에서 직접 실행한다(자동으로는 돌지 않는다).
name: Book Studio Windows 설치 파일
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: book-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: book-studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: book-studio-windows
          path: |
            book-studio/release/*.exe
            book-studio/release/latest.yml
          if-no-files-found: error
